# config/database.yml
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", "postgres") %>
  port: 5432
  username: <%= ENV.fetch("DATABASE_USERNAME", "business_user") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "business_password") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: business_api_development

test:
  <<: *default
  database: business_api_test

production:
  <<: *default
  database: business_api_production